<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสืบค้นโครงข่ายสายทางหลวงชนบท</title>

    <!-- ==================================================================== -->
    <!-- ส่วนที่ 1: นำเข้าไลบรารี Leaflet (Open-source Mapping Library)           -->
    <!-- ที่มา: เป็นเครื่องมือฟรีที่แปลงพิกัดภูมิศาสตร์ (Lat/Lng) มาวาดบนหน้าเว็บ -->
    <!-- ==================================================================== -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- ==================================================================== -->
    <!-- ส่วนที่ 2: ตกแต่งหน้าตาและจัดเลย์เอาต์ (CSS)                              -->
    <!-- ==================================================================== -->
    <style>
        /* รีเซ็ต Margin/Padding และตั้งค่ากล่องให้อยู่ในกรอบเสมอ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* บังคับให้โครงสร้างหน้าเว็บเต็มหน้าจอ 100% พอดี (ไม่มี scrollbar ล้นจอ) */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* แถบ Header ด้านบน */
        header {
            height: 60px;
            background: #004d40; /* สีเขียวเข้มสไตล์กรมทางหลวงชนบท */
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        header h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        /* กล่องค้นหาและปุ่มกด */
        .search-container {
            display: flex;
            gap: 8px;
        }

        .search-container input {
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 340px;
            outline: none;
            font-size: 0.95rem;
        }

        .search-container input:focus {
            border-color: #ffb300;
            box-shadow: 0 0 5px rgba(255, 179, 0, 0.5);
        }

        .search-container button {
            padding: 8px 18px;
            background: #ffb300;
            color: #1a1a1a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .search-container button:hover {
            background: #ffa000;
        }

        /* ป้ายแจ้งเตือนขณะกำลังโหลดไฟล์ JSON */
        #loading-badge {
            position: absolute;
            top: 75px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            z-index: 2000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* พื้นที่แผนที่ขยายเต็มพื้นที่ที่เหลือ */
        #map {
            flex: 1;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- แถบด้านบน: หัวข้อ + ช่องค้นหาที่มี Datalist รองรับ Auto-suggest -->
    <header>
        <h2>ระบบค้นหาโครงข่ายสายทางหลวงชนบท</h2>
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                list="roadOptions" 
                placeholder="พิมพ์รหัสสายทาง (เช่น นบ.1002) หรือชื่อถนน..."
            >
            <!-- แท็ก datalist เป็นถังเก็บตัวเลือกอัตโนมัติ -->
            <datalist id="roadOptions"></datalist>
            
            <button onclick="searchRoad()">ค้นหา</button>
        </div>
    </header>

    <!-- ป้ายแจ้งสถานะการโหลดข้อมูล -->
    <div id="loading-badge">⏳ กำลังโหลดและประมวลผลข้อมูลสายทาง...</div>

    <!-- กล่องแสดงแผนที่ Leaflet -->
    <div id="map"></div>

    <!-- ==================================================================== -->
    <!-- ส่วนที่ 3: ตรรกะการทำงานเบื้องหลัง (JavaScript)                         -->
    <!-- ==================================================================== -->
    <script>
        // -------------------------------------------------------------
        // ขั้นตอนที่ 3.1: เริ่มต้นแผนที่ (Map Initialization)
        // -------------------------------------------------------------
        // สร้าง Object แผนที่ โดยผูกเข้ากับ <div id="map">
        // พิกัดเริ่มต้น [13.85, 100.48] (บริเวณ จ.นนทบุรี) ซูมระดับ 10
        const map = L.map('map').setView([13.85, 100.48], 10);

        // ดึงภาพแผ่นแผนที่ฐาน (Base Tile Layer) จาก OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geoLayer;        // ตัวแปรสำหรับเก็บ Layer เส้นถนนทั้งหมดบนแผนที่
        let searchList = []; // Array สำหรับเก็บ Index ข้อมูล ไว้ค้นหาแบบรวดเร็ว

        // -------------------------------------------------------------
        // ขั้นตอนที่ 3.2: โหลดข้อมูล GeoJSON ด้วย fetch()
        // ที่มา: เนื่องจากไฟล์มีขนาดใหญ่ การใช้ fetch ช่วยให้โหลดแบบ Asynchronous
        //       หน้าเว็บไม่ค้างขณะรออ่านไฟล์
        // -------------------------------------------------------------
        fetch('roads_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('ไม่สามารถดาวน์โหลดไฟล์ roads_data.json ได้');
                }
                return response.json();
            })
            .then(data => {
                // ซ่อนป้าย Loading เมื่อโหลดและแปลง JSON เสร็จ
                document.getElementById('loading-badge').style.display = 'none';

                // ---------------------------------------------------------
                // ขั้นตอนที่ 3.3: นำ GeoJSON มาวาดลงแผนที่ด้วย L.geoJSON
                // ---------------------------------------------------------
                geoLayer = L.geoJSON(data, {
                    // กำหนดสไตล์เส้นถนน
                    style: {
                        color: "#e65100",  // สีส้มทางหลวงชนบท
                        weight: 4,         // ความกว้างของเส้น
                        opacity: 0.85
                    },
                    // onEachFeature จะทำงานทีละ 1 เส้นถนน
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties || {};

                        // ดึงฟิลด์ข้อมูลจาก Attribute Table ของ Shapefile
                         const roadCode  = p.road_code || p.ROAD_CODE || "ไม่ระบุรหัส";
                         const routeName = p.route_name || p.ROUTE_NAME || "ไม่ระบุชื่อ";
                         const province  = p.TH_Provi_1 || p.prov_name_th || "-";
                         const distance  = p.Distance || p.distance || "-";
                         const mainDRR   = p.Main_DRR || p.main_drr || "-";
                         const subDRR    = p.Sub_DRR || p.sub_drr || "-";

                        // 1. ผูกหน้าต่าง Popup แสดงข้อมูลเมื่อผู้ใช้คลิกที่เส้นบนแผนที่
                        layer.bindPopup(`
                            <div style="font-size: 0.95rem; line-height: 1.5;">
                                <b style="color: #004d40; font-size: 1.1rem;">${roadCode}</b><br>
                                </div>
                                <b> ชื่อสายทาง:</b> ${routeName}<br>
                                <b> จังหวัด:</b> ${province}<br>
                                <b> ระยะทาง:</b> <span class="popup-badge">${distance} กม.</span><br>
                                <b> สำนัก:</b> ${mainDRR}<br>
                                <b> หน่วยงานดูแล:</b> ${subDRR}
                                
                            </div>
                        `);

                        // 2. เก็บข้อมูลแต่ละเส้นลงใน searchList เพื่อเตรียมไว้ใช้ค้นหา
                        searchList.push({
                            code: String(roadCode).trim(),
                            name: String(routeName).trim(),
                            layer: layer
                        });
                    }
                }).addTo(map);

                // ปรับขอบเขตแผนที่อัตโนมัติให้พอดีกับเส้นถนนทั้งหมดที่มีในไฟล์
                if (geoLayer.getBounds().isValid()) {
                    map.fitBounds(geoLayer.getBounds());
                }

                // ---------------------------------------------------------
                // ขั้นตอนที่ 3.4: สร้าง Auto-suggest Dropdown ลงใน <datalist>
                // ---------------------------------------------------------
                const datalist = document.getElementById('roadOptions');
                const addedOptions = new Set(); // ป้องกันตัวเลือกชื่อซ้ำ

                searchList.forEach(item => {
                    // เพิ่มรหัสสายทาง (เช่น นบ.1002)
                    if (item.code && item.code !== "ไม่ระบุรหัส" && !addedOptions.has(item.code)) {
                        const optCode = document.createElement('option');
                        optCode.value = item.code;
                        datalist.appendChild(optCode);
                        addedOptions.add(item.code);
                    }
                    // เพิ่มชื่อสายทาง (เช่น แยกทางหลวงหมายเลข 9 - บางคูลัด)
                    if (item.name && item.name !== "ไม่ระบุชื่อ" && !addedOptions.has(item.name)) {
                        const optName = document.createElement('option');
                        optName.value = item.name;
                        datalist.appendChild(optName);
                        addedOptions.add(item.name);
                    }
                });
            })
            .catch(err => {
                document.getElementById('loading-badge').innerText = '❌ เกิดข้อผิดพลาดในการโหลดไฟล์ข้อมูล';
                console.error(err);
            });

        // -------------------------------------------------------------
        // ขั้นตอนที่ 3.5: ฟังก์ชันค้นหาเส้นทาง (Search & Highlight)
        // -------------------------------------------------------------
        function searchRoad() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return;

            // ค้นหาแบบ Partial Match (พิมพ์แค่บางคำในรหัสหรือชื่อถนนก็เจอ)
            const match = searchList.find(item => {
                const code = item.code ? item.code.toLowerCase() : "";
                const name = item.name ? item.name.toLowerCase() : "";
                return code.includes(query) || name.includes(query);
            });

            if (match) {
                // 1. ซูมแผนที่ไปที่เส้นทางนั้นทันที พร้อมระยะ Padding รอบขอบ
                map.fitBounds(match.layer.getBounds(), { padding: [60, 60] });

                // 2. เปิดหน้าต่าง Popup อัตโนมัติ
                match.layer.openPopup();

                // 3. ไฮไลต์เส้นเป็นสีน้ำเงินเข้มและหนาขึ้น 8px ชั่วคราว
                match.layer.setStyle({ color: '#0077b6', weight: 8 });

                // 4. คืนค่าสีเดิมหลังผ่านไป 3 วินาที
                setTimeout(() => {
                    geoLayer.resetStyle(match.layer);
                }, 3000);
            } else {
                alert('ไม่พบข้อมูลสายทางที่ตรงกับ: "' + query + '"');
            }
        }

        // อนุญาตให้กดปุ่ม Enter ในช่องค้นหาได้
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchRoad();
            }
        });
    </script>
</body>
</html>
